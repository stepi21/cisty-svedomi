name: Zmenšit existující fotky ve Storage

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Suchý běh (jen appka spočítá úsporu, nic nezmění)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Nainstalovat závislosti
        run: npm install @supabase/supabase-js sharp

      - name: Spustit zmenšení fotek
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node zmensit-existujici-fotky.mjs
